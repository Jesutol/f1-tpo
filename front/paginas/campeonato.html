<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Telemetry | Campeonato de pilotos</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&amp;family=DM+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-campeonato="pilotos">
    <header class="encabezado">
      <nav class="navegacion">
        <a href="../index.html">Inicio</a>
        <details class="menu-ultimo-gp">
          <summary>Último GP</summary>
          <div class="submenu">
            <a href="./resultado-carrera.html">Carrera</a>
            <a href="./resultado-clasificacion.html">Clasificación</a>
            <a href="./resultado-libres-3.html">Prácticas Libres 3</a>
            <a href="./resultado-libres-2.html">Prácticas Libres 2</a>
            <a href="./resultado-libres-1.html">Prácticas Libres 1</a>
          </div>
        </details>
        <details class="menu-campeonato">
          <summary>Campeonato</summary>
          <div class="submenu">
            <a href="./campeonato.html">Pilotos</a>
            <a href="./constructores.html">Constructores</a>
          </div>
        </details>
      </nav>
      <p class="marca" id="temporada-campeonato">F1 Telemetry</p>
      <h1>Campeonato de pilotos</h1>
      <p id="detalle-campeonato">Consultando el campeonato...</p>
    </header>
    <main>
      <section class="tarjeta-campeon" id="tarjeta-campeon" aria-labelledby="nombre-campeon" hidden>
        <svg class="copa-campeon" viewBox="0 0 48 52" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14 5h20v13c0 10-5 15-10 15s-10-5-10-15V5ZM14 10H5v5c0 8 5 11 11 11M34 10h9v5c0 8-5 11-11 11M24 33v10M15 48h18M19 43h10v5H19z" />
        </svg>
        <div>
          <p class="titulo-campeon" id="titulo-campeon"></p>
          <h2 id="nombre-campeon"></h2>
          <p class="equipo-campeon" id="equipo-campeon"></p>
        </div>
        <div class="escudo-campeon" id="logo-campeon"></div>
      </section>
      <div class="tabla-contenedor">
        <table>
          <caption id="titulo-tabla">Campeonato de pilotos</caption>
          <thead>
            <tr>
              <th scope="col">Posición</th>
              <th scope="col">Piloto</th>
              <th scope="col">Equipo</th>
              <th scope="col">Puntos</th>
            </tr>
          </thead>
          <tbody id="resultados-campeonato" aria-live="polite">
            <tr><td colspan="4">Cargando posiciones...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="../js/datos.js"></script>
    <script src="../js/campeonato.js"></script>
  </body>
</html>
