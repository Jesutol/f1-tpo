<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Telemetry | Resultados</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&amp;family=DM+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <script src="../js/app.js" defer></script>
  </head>
  <body>
    <header class="encabezado">
      <nav class="navegacion" aria-label="Navegación principal">
        <a href="../index.html">Inicio</a>
        <a href="./resultados.html">Resultados</a>
        <details class="menu-ultimo-gp">
          <summary>Último GP</summary>
          <div class="submenu">
            <a href="./sesion.html?sesion=carrera">Carrera</a>
            <a href="./sesion.html?sesion=clasificacion">Clasificación</a>
            <a href="./sesion.html?sesion=libres-3">Prácticas libres 3</a>
            <a href="./sesion.html?sesion=libres-2">Prácticas libres 2</a>
            <a href="./sesion.html?sesion=libres-1">Prácticas libres 1</a>
          </div>
        </details>
        <details class="menu-campeonato">
          <summary>Campeonato</summary>
          <div class="submenu">
            <a href="./campeonato.html?tipo=pilotos">Pilotos</a>
            <a href="./campeonato.html?tipo=constructores">Constructores</a>
          </div>
        </details>
        <details class="menu-busqueda">
          <summary aria-label="Buscar pilotos y equipos">🔍 Buscar</summary>
          <div class="panel-busqueda">
            <form id="form-busqueda" role="search">
              <input
                id="buscar-nombre"
                type="search"
                aria-label="Nombre del piloto o equipo"
                placeholder="Piloto o equipo…"
                maxlength="80"
                required
              />
              <button type="submit">Buscar</button>
            </form>
            <p id="estado-busqueda" class="nota" role="status"></p>
            <ul id="coincidencias"></ul>
          </div>
        </details>
      </nav>
      <p class="marca">F1 Telemetry</p>
      <h1>Resultados</h1>
      <p id="detalle-vista" class="nota" role="status"></p>
      <!-- Los selectores aparecen solo en la vista Resultados. -->
      <div id="filtros-resultados" hidden>
        <label
          >Gran Premio
          <select id="seleccionar-gp" disabled></select>
        </label>
        <label
          >Sesión
          <select id="seleccionar-sesion" disabled></select>
        </label>
      </div>
    </header>
    <main>
      <noscript>Activá JavaScript para consultar los resultados.</noscript>
      <div class="tabla-contenedor">
        <table role="table">
          <caption>
            Resultados
          </caption>
          <thead role="rowgroup"></thead>
          <tbody role="rowgroup" aria-live="polite">
            <tr class="mensaje-tabla" role="row">
              <td role="cell">Cargando datos…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
